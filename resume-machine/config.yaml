# Resume Machine Configuration
#
# This file contains default configuration for the resume machine workflow.
# Environment variables can override these values.
#
# For more information, see:
# https://github.com/your-repo/resume-machine/blob/main/documentation/config.md

# Input directory for job data extraction
input_dir: jobbankjobs

# Output directory for generated artifacts
output_dir: artifacts

# Queue file name for job processing
queue_file: resume-machine-queue.json

# Directory for role-based templates
role_templates_dir: role-based-templates

# Unique data file for resume
unique_data_file: resume.unique-data.json

# Skip HTML extraction step
skip_extract: false

# Dry run mode
dry_run: false

# Log level
log_level: info

# PDF naming template
pdf_naming_template: resume-{candidate}-{company}-{role}.pdf

# Default candidate name (can be overridden by --name flag or RESUME_NAME env var)
candidate_name: "James Valeil"

# Default theme (can be overridden by --template flag or RESUME_THEME env var)
theme: "valeii-professional"
