<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <style>
    /* ── Reset ───────────────────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Variables ───────────────────────────────────────────────────────── */
    :root {
      --accent: #1a365d;
      --accent-light: #2b5090;
      --surface: #f8f9fb;
      --border: #d6dae1;
      --text: #1a1f2b;
      --muted: #5a6072;
      /* Labels/navigation = UI font; all readable content = body font */
      --font-body: 'Source Serif 4', Georgia, serif;
      --font-ui: 'Inter', system-ui, sans-serif;
      --page-w: 8.5in;
      --page-h: 11in;
      --margin: 0.7in;
      /* ── Type scale (print) ───────────────────────────── */
      --fs-name: 16pt;
      /* name, cl-name                            */
      --fs-body: 12pt;
      /* abstract bullets, cl-date                */
      --fs-highlight: 10pt;
      /* positions, abstract ¶, org names, edu    */
      --fs-meta: 9pt;
      /* positions, abstract ¶, org names, edu    */
      --fs-copy: 8.5pt;
      /* highlights, expertise, skills, cl-copy   */
      --fs-small: 8pt;
      /* dates, contact line, org-desc            */
      --fs-label: 9pt;
      /* skill-group-name                         */
    }

    /* ── Layout ──────────────────────────────────────────────────────────── */
    body {
      font-family: var(--font-ui);
      background: #e8ecf0;
      color: var(--text);
    }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .filters-panel {
      width: 320px;
      min-width: 280px;
      background: #fff;
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .filters-panel h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .filter-group label {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .filter-group select,
    .filter-group input[type="text"] {
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-family: var(--font-ui);
      font-size: 0.88rem;
      color: var(--text);
      background: var(--surface);
      width: 100%;
    }

    .filter-group select:focus,
    .filter-group input:focus {
      outline: 2px solid var(--accent-light);
      outline-offset: 1px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--text);
    }

    .toggle-row input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      accent-color: var(--text);
    }

    /* ── Job list ────────────────────────────────────────────────────────── */
    .job-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }

    .job-row {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
      font-size: 0.85rem;
    }

    .job-row:hover {
      background: #f0f4f9;
    }

    .job-row.active {
      background: #e3eaf6;
      border-left: 3px solid var(--text);
      padding-left: calc(0.5rem - 3px);
    }

    .job-row .job-title {
      font-weight: 500;
      color: var(--text);
    }

    .job-row .job-meta {
      color: var(--text);
      font-size: 0.78rem;
      margin-top: 0.15rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .job-domain-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      background: #dde3ed;
      color: #3a4a6b;
      line-height: 1.4;
    }

    .job-domain-badge.domain-ai {
      background: #dce8fc;
      color: #1a4a99;
    }

    .job-domain-badge.domain-backend {
      background: #dff2e8;
      color: #1a6640;
    }

    .job-domain-badge.domain-database {
      background: #f3e8fd;
      color: #5a1a99;
    }

    .job-domain-badge.domain-devops {
      background: #fdeedd;
      color: #7a4010;
    }

    .job-domain-badge.domain-frontend {
      background: #fdf4dd;
      color: #6b5010;
    }

    .job-domain-badge.domain-fullstack {
      background: #eaeaea;
      color: #333;
    }

    .job-domain-badge.domain-manager {
      background: #fde0e0;
      color: #991a1a;
    }

    .empty-state {
      padding: 1rem 0.5rem;
      color: var(--text);
      font-size: 0.85rem;
      font-style: italic;
    }

    /* ── Print area container ────────────────────────────────────────────── */
    .print-container {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .placeholder-msg {
      margin-top: 4rem;
      color: var(--text);
      font-size: 1rem;
      font-style: italic;
      text-align: center;
    }

    .loading-msg {
      margin-top: 4rem;
      color: var(--text);
      font-size: 1rem;
      text-align: center;
    }

    /* ── Page (printable) ────────────────────────────────────────────────── */
    .page {
      width: var(--page-w);
      min-height: var(--page-h);
      background: #fff;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      padding: var(--margin);
      font-family: var(--font-body);
      font-size: 10.5pt;
      line-height: 1.55;
      color: var(--text);
    }

    /* ── Cover letter page ───────────────────────────────────────────────── */
    #cover-letter-section {
      break-after: page;
    }

    #cover-letter-section .resume-header {
      margin-bottom: 2em;
    }

    .cl-date {
      margin-bottom: 1.5em;
      font-size: var(--fs-body);
    }

    .cl-recipient {
      margin-bottom: 1.5em;
      font-weight: 600;
    }

    .cl-body p {
      margin-bottom: 1em;
      line-height: 1.65;
    }

    .cl-body ul {
      margin: 0.5em 0 1em 1.5em;
    }

    .cl-body ul li {
      margin-bottom: 0.3em;
    }

    .cl-signature {
      margin-top: 2em;
      font-size: var(--fs-body);
      line-height: 1.6;
    }

    .cl-signature .sig-name {
      font-weight: 700;
    }

    .cl-signature .sig-title {
      color: var(--muted);
      font-size: var(--fs-meta);
    }

    .cl-signature .sig-contact {
      color: var(--muted);
      font-size: var(--fs-small);
    }

    /* ── Resume page ─────────────────────────────────────────────────────── */
    .resume-header {
      border-bottom: 2px solid var(--text);
      padding-bottom: 0.5em;
      margin-bottom: 1em;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0 0.9em;
    }

    .resume-header h1 {
      font-size: var(--fs-name);
      font-weight: 700;
      white-space: nowrap;
    }

    .resume-header .role {
      font-weight: 400;
      color: var(--text);
      white-space: nowrap;
    }

    .resume-header .contact {
      font-size: var(--fs-small);
      color: var(--text);
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      margin-left: auto;
      align-items: baseline;
    }

    .resume-header .contact span {
      white-space: nowrap;
    }

    .resume-header .contact span:not(:last-child)::after {
      content: '  ·  ';
      white-space: pre;
    }

    .section {
      margin-bottom: 1.1em;
    }

    .section h2 {
      font-size: var(--fs-highlight);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.25em;
      margin-bottom: 0.55em;
    }

    .summary-list {
      list-style: none;
      padding: 0;
    }

    .summary-list li {
      padding: 0.2em 0;
      font-size: var(--fs-highlight);
    }

    .abstract-narrative {
      font-size: var(--fs-meta);
      margin-bottom: 0.55em;
    }

    .summary-list li::before {
      content: '▸ ';
      color: var(--text);
      font-size: 8pt;
    }

    .work-entry {
      margin-bottom: 0.9em;
    }

    .work-header {
      display: flex;
      align-items: baseline;
      gap: 0.5em;
    }

    .work-company {
      font-weight: 700;
      white-space: nowrap;
    }

    .work-dates {
      font-size: var(--fs-small);
      color: var(--text);
      white-space: nowrap;
    }

    .work-position {
      font-style: italic;
      font-size: var(--fs-meta);
      color: var(--text);
      flex: 1;
    }

    .work-summary {
      font-size: var(--fs-copy);
      margin-bottom: 0.3em;
    }

    .work-highlights {
      list-style: none;
      padding: 0;
    }

    .work-highlights li {
      font-size: var(--fs-copy);
      padding: 0.15em 0 0.15em 0.9em;
      text-indent: -0.9em;
    }

    .work-highlights li::before {
      content: '• ';
      color: var(--text);
    }

    .edu-entry {
      margin-bottom: 0.5em;
      font-size: var(--fs-meta);
    }

    .edu-entry .institution {
      font-weight: 600;
    }

    .edu-entry .degree {
      color: var(--text);
      font-style: italic;
    }

    /* ── Areas of expertise ──────────────────────────────────────────────────── */
    .expertise-tags {
      display: flex;
      flex-wrap: wrap;
      column-gap: 0;
    }

    .expertise-tag {
      font-size: var(--fs-copy);
      color: var(--text);
    }

    .expertise-tag:not(:last-child)::after {
      content: '  ·  ';
      color: var(--text);
      white-space: pre;
    }

    /* ── Skills grouped ──────────────────────────────────────────────────────── */
    .skill-group {
      margin-bottom: 0.45em;
    }

    .skill-group-name {
      font-size: var(--fs-label);
      font-weight: 600;
      font-family: var(--font-ui);
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.1em;
    }

    .skill-keywords {
      font-size: var(--fs-copy);
      font-family: var(--font-body);
      color: var(--text);
    }

    /* ── Open source & community ─────────────────────────────────────────────── */
    .community-entry {
      margin-bottom: 0.45em;
    }

    .community-entry .org-name {
      font-weight: 600;
      font-size: var(--fs-meta);
    }

    .community-entry .org-role {
      font-style: italic;
      color: var(--text);
      font-size: var(--fs-copy);
    }

    .community-entry .org-dates {
      font-size: var(--fs-small);
      color: var(--text);
    }

    .community-entry .org-desc {
      font-size: var(--fs-small);
      margin-top: 0.1em;
    }

    .community-entry .org-link {
      font-size: 8pt;
      color: var(--accent-light);
    }

    /* ── Resume footer ───────────────────────────────────────────────────────── */
    .resume-footer {
      margin-top: 1.2em;
      padding-top: 0.4em;
      border-top: 1px solid var(--border);
      font-size: 8pt;
      color: var(--text);
      text-align: center;
      line-height: 1.8;
    }

    .resume-footer a {
      color: var(--text);
      text-decoration: none;
    }

    /* ── Print styles ────────────────────────────────────────────────────── */
    @media print {
      body {
        background: none;
      }

      .filters-panel {
        display: none !important;
      }

      .print-container {
        padding: 0;
        align-items: stretch;
      }

      .page {
        width: 100%;
        min-height: 0;
        box-shadow: none;
        padding: 0;
        margin: 0;
      }

      @page {
        size: letter;
        margin: var(--margin);
      }
    }

    /* ── Utilities ───────────────────────────────────────────────────────── */
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- ── Filters panel ──────────────────────────────────────────────────── -->
    <aside class="filters-panel" id="filters-panel">
      <h1>Resume Machine</h1>

      <div class="filter-group">
        <label for="year-select">Year</label>
        <select id="year-select"></select>
      </div>

      <div class="filter-group">
        <label for="month-select">Month</label>
        <select id="month-select">
          <option value="">All months</option>
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="keyword-input">Search</label>
        <input type="text" id="keyword-input" placeholder="Job title or employer…" />
      </div>

      <div class="toggle-row">
        <input type="checkbox" id="cover-letter-toggle" checked />
        <label for="cover-letter-toggle">Include cover letter</label>
      </div>

      <div class="toggle-group" id="volunteer-toggle-group"
        style="display:none; margin-top: 1rem; padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px;">
        <div style="font-weight: 500; font-size: 0.9rem; margin-bottom: 0.5rem;">Open Source & Community</div>
        <div id="volunteer-toggles"></div>
      </div>

      <div class="job-list" id="job-list">
        <div class="empty-state">Loading jobs…</div>
      </div>
    </aside>

    <!-- ── Print area ─────────────────────────────────────────────────────── -->
    <main class="print-container" id="print-container">
      <div class="placeholder-msg" id="placeholder-msg">Select a job to preview your resume.</div>
      <div class="loading-msg hidden" id="loading-msg">Loading…</div>

      <!-- Cover letter page -->
      <div class="page hidden" id="cover-letter-section">
        <div class="resume-header">
          <h1 id="cl-name"></h1>
          <div class="role" id="cl-role"></div>
          <div class="contact" id="cl-contact"></div>
        </div>
        <div class="cl-date" id="cl-date"></div>
        <div class="cl-recipient" id="cl-recipient"></div>
        <div class="cl-body">
          <p id="cl-opening"></p>
          <div id="cl-reasoning"></div>
          <p id="cl-closing"></p>
        </div>
        <div class="cl-signature" id="cl-signature"></div>
      </div>

      <!-- Resume page -->
      <div class="page hidden" id="resume-section">
        <div class="resume-header">
          <h1 id="r-name"></h1>
          <div class="role" id="r-role"></div>
          <div class="contact" id="r-contact"></div>
        </div>

        <div class="section" id="summary-section">
          <h2>Abstract</h2>
          <p class="abstract-narrative" id="r-abstract-narrative"></p>
          <ul class="summary-list" id="r-summary"></ul>
        </div>

        <div class="section" id="expertise-section">
          <h2>Areas of Expertise</h2>
          <div class="expertise-tags" id="r-expertise"></div>
        </div>

        <div class="section" id="work-section">
          <h2>Experience</h2>
          <div id="r-work"></div>
        </div>

        <div class="section" id="skills-section">
          <h2>Skills</h2>
          <div id="r-skills"></div>
        </div>

        <div class="section" id="community-section">
          <h2>Open Source &amp; Community Leadership</h2>
          <div id="r-community"></div>
        </div>

        <div class="section" id="education-section">
          <h2>Education</h2>
          <div id="r-education"></div>
        </div>

        <div class="resume-footer" id="r-footer"></div>
      </div>
    </main>
  </div>

  <script type="module">
    // ── State ───────────────────────────────────────────────────────────────
    let allJobs = [];
    let resumeCache = null;
    let activeJobPath = null;

    // ── DOM refs ────────────────────────────────────────────────────────────
    const yearSelect = document.getElementById('year-select');
    const monthSelect = document.getElementById('month-select');
    const keywordInput = document.getElementById('keyword-input');
    const clToggle = document.getElementById('cover-letter-toggle');
    const jobList = document.getElementById('job-list');

    const placeholder = document.getElementById('placeholder-msg');
    const loadingMsg = document.getElementById('loading-msg');
    const clSection = document.getElementById('cover-letter-section');
    const resumeSection = document.getElementById('resume-section');

    // ── Helpers ─────────────────────────────────────────────────────────────
    function slugify(s) {
      return (s || '').toLowerCase().replace(/[^0-9a-z]+/g, '-').replace(/-{2,}/g, '-').replace(/^-|-$/g, '');
    }

    function showLoading(show) {
      loadingMsg.classList.toggle('hidden', !show);
      placeholder.classList.add('hidden');
    }

    function showPlaceholder() {
      placeholder.classList.remove('hidden');
      loadingMsg.classList.add('hidden');
      clSection.classList.add('hidden');
      resumeSection.classList.add('hidden');
    }

    function el(tag, cls, html) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function txt(id, value) {
      document.getElementById(id).textContent = value || '';
    }

    function html(id, value) {
      document.getElementById(id).innerHTML = value || '';
    }

    // ── Fetch wrappers ──────────────────────────────────────────────────────
    async function fetchJSON(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${url}`);
      return res.json();
    }

    // ── Job list rendering ──────────────────────────────────────────────────
    function filterJobs() {
      const kw = keywordInput.value.trim().toLowerCase();
      return kw
        ? allJobs.filter(j =>
          j.job_title.toLowerCase().includes(kw) ||
          j.employer.toLowerCase().includes(kw))
        : allJobs;
    }

    function renderJobList() {
      const filtered = filterJobs();
      if (!filtered.length) {
        jobList.innerHTML = '<div class="empty-state">No results for current filters.</div>';
        return;
      }
      jobList.innerHTML = '';
      for (const job of filtered) {
        const row = el('div', 'job-row' + (job.path === activeJobPath ? ' active' : ''));
        const domainBadge = job.domain
          ? `<span class="job-domain-badge domain-${job.domain}">${job.domain}</span>`
          : '';
        row.innerHTML = `
        <div class="job-title">${job.job_title || 'Untitled'}</div>
        <div class="job-meta">${job.employer || ''}${domainBadge}</div>`;
        row.addEventListener('click', () => selectJob(job.path));
        jobList.appendChild(row);
      }
    }

    // ── Load jobs ───────────────────────────────────────────────────────────
    async function loadJobs() {
      const year = yearSelect.value;
      const month = monthSelect.value;
      if (!year) return;

      let url = `/api/jobs?year=${encodeURIComponent(year)}`;
      if (month) url += `&month=${encodeURIComponent(month)}`;

      try {
        allJobs = await fetchJSON(url);
      } catch {
        allJobs = [];
      }
      renderJobList();
    }

    // ── Select a job ────────────────────────────────────────────────────────
    async function selectJob(path) {
      activeJobPath = path;
      showLoading(true);
      renderJobList();

      try {
        const [corr, resume] = await Promise.all([
          fetchJSON(`/api/correlation?path=${encodeURIComponent(path)}`),
          resumeCache ? Promise.resolve(resumeCache) : fetchJSON('/api/resume').then(r => { resumeCache = r; return r; }),
        ]);

        hydratePages(corr, resume);
      } catch (err) {
        console.error('Failed to load job:', err);
        showPlaceholder();
      } finally {
        showLoading(false);
      }
    }

    // ── Domain → priority skill groups ──────────────────────────────────────
    const DOMAIN_SKILL_PRIORITY = {
      fullstack: ['Languages & Frameworks', 'DevOps, Infrastructure & Development'],
      backend: ['Languages & Frameworks', 'DevOps, Infrastructure & Development', 'Testing, QA & Observability'],
      frontend: ['Languages & Frameworks', 'Platforms, Tools & Build Systems'],
      devops: ['DevOps, Infrastructure & Development', 'Testing, QA & Observability'],
      manager: ['Project Management & Collaboration'],
      ai: ['Languages & Frameworks', 'DevOps, Infrastructure & Development'],
      database: ['DevOps, Infrastructure & Development', 'Platforms, Tools & Build Systems'],
    };

    // ── Hydrate pages ────────────────────────────────────────────────────────
    function hydratePages(corr, resume) {
      const basics = resume.basics || {};
      const meta = corr.metadata || {};
      const domain = corr.domain || '';

      // ── Cover letter ───────────────────────────────────────────────────────
      txt('cl-name', basics.name);
      txt('cl-role', basics.label || meta.job_title || '');
      const clContact = document.getElementById('cl-contact');
      clContact.innerHTML = '';
      for (const part of [basics.email, basics.phone].filter(Boolean)) {
        clContact.appendChild(el('span', null, part));
      }

      const now = new Date();
      txt('cl-date', now.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }));
      txt('cl-recipient', meta.employer || '');
      txt('cl-opening', corr.opening || '');

      const clReasoning = document.getElementById('cl-reasoning');
      clReasoning.innerHTML = '';
      for (const para of (corr.reasoning_paragraphs || [])) {
        clReasoning.appendChild(el('p', null, para));
      }

      txt('cl-closing', corr.closing || '');

      const clSig = document.getElementById('cl-signature');
      clSig.innerHTML = '';
      const sig = corr.signature || {};
      if (sig.name) clSig.appendChild(el('div', 'sig-name', sig.name));
      if (sig.title) clSig.appendChild(el('div', 'sig-title', sig.title));
      if (sig.email) clSig.appendChild(el('div', 'sig-contact', sig.email));
      if (sig.phone) clSig.appendChild(el('div', 'sig-contact', sig.phone));

      // ── Resume header ──────────────────────────────────────────────────────
      txt('r-name', basics.name);
      txt('r-role', basics.label || meta.job_title || '');

      const rContact = document.getElementById('r-contact');
      rContact.innerHTML = '';
      for (const part of [basics.email, basics.phone].filter(Boolean)) {
        rContact.appendChild(el('span', null, part));
      }

      // ── Abstract — narrative paragraph + template highlights, up to 4 ──────
      const abstractNarrative = document.getElementById('r-abstract-narrative');
      const summaryBlocks = basics.summary || [];
      const abstractBlock = Array.isArray(summaryBlocks)
        ? summaryBlocks.find(b => b.name === 'Abstract')
        : null;
      abstractNarrative.textContent = abstractBlock?.value
        || (typeof summaryBlocks === 'string' ? summaryBlocks : '');

      const summaryList = document.getElementById('r-summary');
      summaryList.innerHTML = '';
      for (const h of (corr.highlights || []).slice(0, 4)) {
        const li = document.createElement('li');
        const semi = h.indexOf(';');
        if (semi !== -1) {
          li.innerHTML = `<strong>${h.slice(0, semi + 1)}</strong>${h.slice(semi + 1)}`;
        } else {
          li.textContent = h;
        }
        summaryList.appendChild(li);
      }

      // ── Areas of expertise ────────────────────────────────────────────────
      const expertiseDiv = document.getElementById('r-expertise');
      expertiseDiv.innerHTML = '';

      // Use domain-specific interests if available and have keywords to swap
      const domainInterests = corr.domain_interests || [];
      const interestGroup = (resume.interests || []).find(i => i.name === 'Areas of Expertise');
      let keywords = interestGroup?.keywords || [];

      if (domainInterests.length > 0) {
        // Identify which 4 keywords to replace (the swappable ones)
        const replaceable = [
          'PHP & JavaScript Development',
          'PIM & CMS Architecture',
          'E-Commerce Growth',
          'Shopify Integration/Migration',
        ];
        // Keep permanent keywords, replace others with domain interests
        const permanent = keywords.filter(kw => !replaceable.includes(kw));
        keywords = permanent.concat(domainInterests.slice(0, 4 - permanent.length));
      }

      for (const kw of keywords) {
        expertiseDiv.appendChild(el('span', 'expertise-tag', kw));
      }

      // ── Work experience ────────────────────────────────────────────────────
      const workDiv = document.getElementById('r-work');
      workDiv.innerHTML = '';
      for (const job of (resume.work || [])) {
        const entry = el('div', 'work-entry');
        const startY = (job.startDate || '').slice(0, 4);
        const endY = job.endDate ? (job.endDate || '').slice(0, 4) : 'Present';
        entry.innerHTML = `
        <div class="work-header">
          <span class="work-company">${job.company || job.name || ''}</span>
          <span class="work-position">${job.position || ''}</span>
          <span class="work-dates">${startY}–${endY}</span>
        </div>
        <div class="work-summary">${job.summary || ''}</div>`;
        if ((job.highlights || []).length) {
          const ul = el('ul', 'work-highlights');
          for (const h of job.highlights) {
            ul.appendChild(el('li', null, h));
          }
          entry.appendChild(ul);
        }
        workDiv.appendChild(entry);
      }

      // ── Skills — grouped, priority groups sorted first ─────────────────────
      const skillsDiv = document.getElementById('r-skills');
      skillsDiv.innerHTML = '';
      const priorityNames = DOMAIN_SKILL_PRIORITY[domain] || [];
      const allGroups = resume.skills || [];
      const orderedGroups = [
        ...allGroups.filter(g => priorityNames.includes(g.name)),
        ...allGroups.filter(g => !priorityNames.includes(g.name)),
      ];
      for (const group of orderedGroups) {
        const isPriority = priorityNames.includes(group.name);
        const groupDiv = el('div', 'skill-group' + (isPriority ? ' priority' : ''));
        groupDiv.appendChild(el('div', 'skill-group-name', group.name));
        groupDiv.appendChild(el('div', 'skill-keywords', (group.keywords || []).join('  ·  ')));
        skillsDiv.appendChild(groupDiv);
      }

      // ── Open Source & Community Leadership ────────────────────────────────
      const communityDiv = document.getElementById('r-community');
      communityDiv.innerHTML = '';
      for (const proj of (resume.projects || [])) {
        const entry = el('div', 'community-entry');
        const dateStr = [proj.startDate, proj.endDate].filter(Boolean).join('–');
        const roleStr = (proj.roles || []).length ? ` <span class="org-role">${proj.roles.join(', ')}</span>` : '';
        const dateSpan = dateStr ? ` <span class="org-dates">${dateStr}</span>` : '';
        const linkHtml = proj.url ? `<a class="org-link" href="${proj.url}">${proj.url}</a>` : '';
        const sep = proj.description && proj.url ? ' — ' : '';
        const descLink = (proj.description || proj.url)
          ? `<div class="org-desc">${proj.description || ''}${sep}${linkHtml}</div>`
          : '';
        entry.innerHTML = `<span class="org-name">${proj.name || ''}</span>${roleStr}${dateSpan}${descLink}`;
        communityDiv.appendChild(entry);
      }

      // Load volunteer visibility state from localStorage
      const volunteerStates = JSON.parse(localStorage.getItem('volunteerVisibility') || '{}');

      for (const vol of (resume.volunteer || [])) {
        const volId = vol.id || vol.organization;
        const isVisible = volunteerStates[volId] !== false; // default to true
        const entry = el('div', 'community-entry');
        if (!isVisible) entry.style.display = 'none';
        const dateStr = [vol.startDate, vol.endDate].filter(Boolean).join('–');
        const dateSpan = dateStr ? ` <span class="org-dates">${dateStr}</span>` : '';
        entry.innerHTML = `<span class="org-name">${vol.organization || ''}</span>, <span class="org-role">${vol.position || ''}</span>${dateSpan}`;
        communityDiv.appendChild(entry);
      }

      // Populate volunteer toggles
      const volunteerTogglesDiv = document.getElementById('volunteer-toggles');
      volunteerTogglesDiv.innerHTML = '';
      if ((resume.volunteer || []).length > 0) {
        document.getElementById('volunteer-toggle-group').style.display = 'block';
        for (const vol of (resume.volunteer || [])) {
          const volId = vol.id || vol.organization;
          const isVisible = volunteerStates[volId] !== false;
          const checkbox = el('input', null, null);
          checkbox.type = 'checkbox';
          checkbox.id = `vol-toggle-${volId}`;
          checkbox.checked = isVisible;
          checkbox.addEventListener('change', () => {
            volunteerStates[volId] = checkbox.checked;
            localStorage.setItem('volunteerVisibility', JSON.stringify(volunteerStates));
            hydratePage();
          });
          const label = el('label', null, vol.label || vol.organization);
          label.htmlFor = `vol-toggle-${volId}`;
          label.style.marginLeft = '0.3rem';
          const row = el('div', null, null);
          row.style.fontSize = '0.85rem';
          row.style.marginBottom = '0.3rem';
          row.appendChild(checkbox);
          row.appendChild(label);
          volunteerTogglesDiv.appendChild(row);
        }
      }

      // ── Education ──────────────────────────────────────────────────────────
      const eduDiv = document.getElementById('r-education');
      eduDiv.innerHTML = '';
      for (const e of (resume.education || [])) {
        const entry = el('div', 'edu-entry');
        entry.innerHTML = `<span class="institution">${e.institution || ''}</span> — <span class="degree">${e.studyType || ''}, ${e.area || ''}</span>`;
        eduDiv.appendChild(entry);
      }

      // ── Footer — profile URLs ──────────────────────────────────────────────
      const footerDiv = document.getElementById('r-footer');
      const footerLinks = [];
      if (basics.url) footerLinks.push({ label: basics.url.replace(/^https?:\/\//, ''), url: basics.url });
      for (const p of (basics.profiles || [])) {
        if (p.url) footerLinks.push({ label: p.url.replace(/^https?:\/\//, ''), url: p.url });
      }
      footerDiv.innerHTML = footerLinks.map(l => `<a href="${l.url}">${l.label}</a>`).join('  ·  ');

      // ── Visibility ─────────────────────────────────────────────────────────
      placeholder.classList.add('hidden');
      loadingMsg.classList.add('hidden');
      clSection.classList.toggle('hidden', !clToggle.checked);
      resumeSection.classList.remove('hidden');

      // ── document.title for print ────────────────────────────────────────────
      const candidateName = meta.candidate_name || slugify(basics.name || '');
      const employer = slugify(meta.employer || '');
      const jobTitle = slugify(meta.job_title || '');
      document.title = [candidateName, employer, jobTitle].filter(Boolean).join('-');
    }

    // ── Event listeners ─────────────────────────────────────────────────────
    yearSelect.addEventListener('change', () => {
      monthSelect.value = '';
      loadJobs();
    });

    monthSelect.addEventListener('change', loadJobs);

    keywordInput.addEventListener('input', renderJobList);

    clToggle.addEventListener('change', () => {
      clSection.classList.toggle('hidden', !clToggle.checked);
    });

    // ── Init ─────────────────────────────────────────────────────────────────
    async function init() {
      try {
        const years = await fetchJSON('/api/years');
        yearSelect.innerHTML = '';
        const currentYear = String(new Date().getFullYear());
        for (const y of years) {
          const opt = document.createElement('option');
          opt.value = y;
          opt.textContent = y;
          if (y === currentYear) opt.selected = true;
          yearSelect.appendChild(opt);
        }
        if (!yearSelect.value && years.length) yearSelect.value = years[0];
        const currentMonth = String(new Date().getMonth() + 1);
        if (monthSelect.querySelector(`option[value="${currentMonth}"]`)) {
          monthSelect.value = currentMonth;
        }
      } catch {
        yearSelect.innerHTML = '<option value="">No years found</option>';
      }
      await loadJobs();
    }

    init();
  </script>
</body>

</html>
