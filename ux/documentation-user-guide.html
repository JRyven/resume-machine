<!DOCTYPE html>
<html lang="en-CA">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Guide — Resume Machine</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet" />
  <style>
    body {
      font-family: 'Source Serif Pro', Georgia, serif;
      color: #111827;
      font-size: 11.5pt;
      line-height: 1.32;
      background: #fff;
      padding: 0.7in;
      max-width: 8.5in;
      margin: 0 auto;
    }

    .markdown-body {
      font-family: inherit;
      color: inherit;
      max-width: 800px;
      margin: 0 auto;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Inter', Arial, sans-serif;
      color: #1490c7;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }

    pre,
    code {
      font-family: 'Source Code Pro', monospace;
      background: #f8fafc;
      border-radius: 4px;
      padding: 2px 6px;
    }

    blockquote {
      border-left: 3px solid #e5e7eb;
      color: #6b7280;
      padding-left: 12pt;
      margin: 1em 0;
      font-style: italic;
    }

    ul,
    ol {
      margin-left: 1.5em;
      margin-bottom: 1em;
    }

    a {
      color: #1490c7;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      body {
        padding: 0.4in;
      }
    }
  </style>
</head>

<body>
  <div class="markdown-body" id="markdown-content">
    Loading user guide...
  </div>
  <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
  <script>
    // Path to your markdown file (must be served via http/https, not file:// for fetch to work)
    const mdPath = "documentation/user/guide.md";
    fetch(mdPath)
      .then(response => response.text())
      .then(md => {
        const mdParser = window.markdownit({ html: true, linkify: true, typographer: true });
        document.getElementById('markdown-content').innerHTML = mdParser.render(md);
      })
      .catch(err => {
        document.getElementById('markdown-content').innerHTML = '<p style="color:red">Failed to load guide.md. Make sure this file is served via a local web server, not file://</p>';
      });
  </script>
</body>

</html>
